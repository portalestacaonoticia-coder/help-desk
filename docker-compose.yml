services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      # Host 5434 → container 5432 (5432/5433 já usados por outros projetos locais)
      - "5434:5432"
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpdesk_pgdata:
